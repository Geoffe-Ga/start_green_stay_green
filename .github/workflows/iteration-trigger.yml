name: Iteration Trigger

# Posts a brief executive summary on a PR (commenting as Geoffe-Ga via PAT)
# whenever CI completes fully green AND a Claude review has been posted.
# The comment is intended to fire a webhook that wakes the Claude Code mobile
# app via MCP so it can continue iterating on feedback. Capped at 10 self-posts
# per PR to avoid runaway loops.
#
# Required secrets:
#   GEOFFE_GA_PAT  - personal access token for Geoffe-Ga with `pull-requests: write`.
#                    Without this the comment would post as github-actions[bot]
#                    and the mobile webhook would not recognize the author.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  nudge:
    name: Post executive summary
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number from head branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
                 --json number --jq '.[0].number // empty')
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Compose and post summary
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GEOFFE_GA_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          MARKER: '<!-- iteration-trigger -->'
        run: |
          set -euo pipefail

          # Pull PR comments once (first 100 is plenty for an active PR).
          gh api "repos/$REPO/issues/$PR/comments?per_page=100" > comments.json

          # Cap: stop after 10 prior self-posts on this PR.
          PRIOR=$(grep -c "$MARKER" comments.json || true)
          if [ "$PRIOR" -ge 10 ]; then
            echo "Cap reached ($PRIOR/10) - skipping"
            exit 0
          fi

          # The verdict line is a public literal, so only the identities
          # claude-code-review.yml's `Post review` step posts as count: the
          # GEOFFE_GA_PAT owner, or github-actions[bot] (its GITHUB_TOKEN
          # fallback). Matched case-insensitively; a null user never matches.
          # This workflow's own summaries (they carry $MARKER and a
          # "**VERDICT**:" line) are never a review. The review must also be
          # newer than the head commit: an older one reviewed older code.
          # scripts/ralph/pr-ready.sh and the address-feedback skill read
          # verdicts the same way; change them together.
          VERDICT_AUTHORS='["geoffe-ga","github-actions[bot]"]'
          HEAD_DATE=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.date')
          CLAUDE=$(jq -c --argjson authors "$VERDICT_AUTHORS" --arg marker "$MARKER" '[.[]
                     | select((.user.login // "" | ascii_downcase) as $a | $authors | index([$a]))
                     | select(.body != null and (.body | contains($marker) | not))
                     | select(.body | test("(^|\\n)## Verdict:"))] | last // empty' comments.json)
          if [ -z "$CLAUDE" ]; then
            echo "No Claude review yet - skipping"
            exit 0
          fi
          ID=$(jq -r '.id'         <<<"$CLAUDE")
          BODY=$(jq -r '.body'       <<<"$CLAUDE")
          CREATED=$(jq -r '.created_at' <<<"$CLAUDE")
          # RFC3339 UTC timestamps are fixed-width, so a string compare is a
          # chronological one.
          if [ -z "$HEAD_DATE" ] || ! [[ "$CREATED" > "$HEAD_DATE" ]]; then
            echo "Latest review predates the head commit - skipping until it is re-reviewed"
            exit 0
          fi

          # Read the verdict off its own line only. Grepping the whole body is
          # wrong both ways: a COMMENTS rationale can say "LGTM", and an LGTM
          # review can mention CHANGES_REQUESTED. Anything else clears nothing.
          VLINE=$(grep -m1 -E '^## Verdict:' <<<"$BODY" || true)
          VALUE=$(sed -E 's/^## Verdict:[[:space:]]*//; s/[[:space:]]+$//' <<<"$VLINE")
          case "$VALUE" in
            LGTM)              VERDICT='LGTM' ;;
            CHANGES_REQUESTED) VERDICT='CHANGES REQUESTED' ;;
            COMMENTS)          VERDICT='COMMENTS' ;;
            *)                 VERDICT='UNPARSED' ;;
          esac

          # COMMENTS is a sign-off that never iterates. It clears a merge once
          # address-feedback Step 1A has filed each finding as a P0-P3
          # follow-up issue and posted its "Follow-ups filed:" comment after
          # the verdict (the same signal scripts/ralph/pr-ready.sh reads).
          FILED=$(jq -r --arg since "$CREATED" '[.[] | select(.body != null
                     and (.created_at // "") > $since
                     and (.body | test("(?im)^\\s*follow-ups filed:")))] | length' comments.json)

          # CI status from check-runs on the head SHA.
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > runs.json
          TOTAL=$(jq '.check_runs | length'                                       runs.json)
          GREEN=$(jq '[.check_runs[] | select(.conclusion=="success")] | length' runs.json)

          CLEARED="You are cleared to squash merge, delete the branch, clean any worktrees, and unsubscribe from webhooks. Please proceed."
          FILE_FOLLOWUPS="Do NOT iterate on this review: pull comment ${ID}, file each actionable finding as a follow-up issue with a P0-P3 label matched to its severity, and post a comment starting 'Follow-ups filed:' (address-feedback Step 1A)."
          if [ "$VERDICT" = "COMMENTS" ] && [ "$FILED" -eq 0 ]; then
            if [ "$GREEN" = "$TOTAL" ]; then
              ACTION="${FILE_FOLLOWUPS} Then the PR is ready to squash merge."
            else
              ACTION="${FILE_FOLLOWUPS} CI is not fully green yet - fix only the failing checks."
            fi
          elif [ "$GREEN" = "$TOTAL" ] && { [ "$VERDICT" = "LGTM" ] || [ "$VERDICT" = "COMMENTS" ]; }; then
            ACTION="$CLEARED"
          elif [ "$VERDICT" = "UNPARSED" ]; then
            ACTION="NOT cleared to merge: comment ${ID} has no readable Verdict line. Surface it to a human; do not infer a verdict."
          else
            ACTION="pull comment ${ID} to see in-depth feedback and continue iterating"
          fi

          BODY=$(printf '%s\n%s\n%s\n%s\n' \
            "$MARKER" \
            "**CI**: ${GREEN}/${TOTAL} Green" \
            "**VERDICT**: ${VERDICT}" \
            "**Action**: ${ACTION}")
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
